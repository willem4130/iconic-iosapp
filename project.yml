name: IconicFestival
options:
  bundleIdPrefix: nl.iconic
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

configFiles:
  Debug: IconicFestival/Configuration/Debug.xcconfig
  Release: IconicFestival/Configuration/Production.xcconfig

settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:
  IconicFestival:
    type: application
    platform: iOS
    sources:
      - path: IconicFestival
        excludes:
          - "**/.DS_Store"
          - "Configuration"
    settings:
      base:
        PRODUCT_NAME: IconicFestival
        PRODUCT_BUNDLE_IDENTIFIER: nl.iconic.festivalapp
        INFOPLIST_FILE: IconicFestival/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: true
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    entitlements:
      path: IconicFestival/IconicFestival.entitlements
      properties:
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)nl.iconic.festivalapp
    preBuildScripts:
      - name: SwiftLint
        script: |
          # Check common installation paths for SwiftLint
          if [ -f /opt/homebrew/bin/swiftlint ]; then
            SWIFTLINT=/opt/homebrew/bin/swiftlint
          elif [ -f /usr/local/bin/swiftlint ]; then
            SWIFTLINT=/usr/local/bin/swiftlint
          elif which swiftlint > /dev/null; then
            SWIFTLINT=swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
            exit 0
          fi
          cd "$SRCROOT"
          "$SWIFTLINT" lint IconicFestival
        basedOnDependencyAnalysis: false

  IconicFestivalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IconicFestivalTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: IconicFestival
    settings:
      base:
        PRODUCT_NAME: IconicFestivalTests
        PRODUCT_MODULE_NAME: IconicFestivalTests
        PRODUCT_BUNDLE_IDENTIFIER: nl.iconic.festivalapp.tests
        INFOPLIST_FILE: IconicFestivalTests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IconicFestival.app/IconicFestival"
        BUNDLE_LOADER: "$(TEST_HOST)"

  IconicFestivalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IconicFestivalUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: IconicFestival
    settings:
      base:
        PRODUCT_NAME: IconicFestivalUITests
        PRODUCT_MODULE_NAME: IconicFestivalUITests
        PRODUCT_BUNDLE_IDENTIFIER: nl.iconic.festivalapp.uitests
        INFOPLIST_FILE: IconicFestivalUITests/Info.plist
        TEST_TARGET_NAME: IconicFestival

schemes:
  IconicFestival:
    build:
      targets:
        IconicFestival: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IconicFestivalTests
        - IconicFestivalUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
